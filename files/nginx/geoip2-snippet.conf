# =========================================================================
#  Snippet GeoIP2 - va DENTRO del bloque http { ... } de /etc/nginx/nginx.conf
#  El script lo inserta automaticamente. Se deja aca como referencia.
# =========================================================================

geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    $geoip2_country_code country iso_code;
}

# Solo Argentina pasa. Para agregar paises: sumar lineas 'XX yes;'
map $geoip2_country_code $allowed_country {
    default no;
    AR yes;
}
