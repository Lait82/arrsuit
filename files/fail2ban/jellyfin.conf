# Filtro fail2ban para Jellyfin -> /etc/fail2ban/filter.d/jellyfin.conf
# OJO: el formato del mensaje cambia entre versiones de Jellyfin.
# Validar SIEMPRE con:
#   fail2ban-regex /srv/config/jellyfin/log/<archivo>.log /etc/fail2ban/filter.d/jellyfin.conf
# Si no matchea, pegar una linea real del log (con IP tapada) y ajustar.

[Definition]
failregex = ^.*Authentication request for .* has been denied \(IP: "?<ADDR>"?\)\.
ignoreregex =
