# =========================================================================
#  Media stack para VPS (CPU-only) - Manu
#  Gluetun (ProtonVPN/WireGuard) -> qBittorrent
#  Prowlarr, Radarr, Sonarr, Bazarr, Jellyseerr, Tdarr, Recyclarr, FlareSolverr
#  Jellyfin -> unico servicio expuesto (via nginx en :80, geo-bloqueo AR)
#
#  Datos en /srv (config) y media en /srv/media
#
#  BINDS DE SEGURIDAD:
#    - Jellyfin: 127.0.0.1  -> solo lo alcanza nginx (que aplica geo + rate limit)
#    - arr y paneles: 100.x.y.z (IP Tailscale) -> solo vos, por el tailnet
#    - qBittorrent WebUI: 127.0.0.1 -> por Tailscale via IP del host
#    - Torrent (6881): sale por gluetun/ProtonVPN, no por la IP del VPS
#
#  >>> REEMPLAZA 100.x.y.z por tu IP de Tailscale (tailscale ip -4)
# =========================================================================

services:

  # -----------------------------------------------------------------------
  # Jellyfin - media server. UNICO expuesto, detras de nginx en el host.
  # Bindeado a localhost: solo nginx le llega.
  # -----------------------------------------------------------------------

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    networks: [media]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - JELLYFIN_PublishedServerUrl=http://194.238.30.202
    volumes:
      - /srv/config/jellyfin:/config
      # media — MISMOS paths de siempre
      - /srv/media/movies:/data/movies
      - /srv/media/series:/data/series
      - /srv/media/anime:/data/anime
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------------------
  # VPN: todo el trafico de qBittorrent sale por aca. Killswitch incluido.
  # -----------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:8080:8080"   # WebUI qBittorrent -> acceso por Tailscale via IP del host
      - "6881:6881"             # torrent TCP (sale por ProtonVPN igual)
      - "6881:6881/udp"         # torrent UDP
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      # >>> Pega tu private key de WireGuard de Proton aca (ver GUIA paso 1)
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # Port forwarding nativo de Proton (mejor ratio de seed)
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      # Elegi pais con servidores P2P (ej: Suiza, Paises Bajos)
      - SERVER_COUNTRIES=Switzerland
      - TZ=America/Argentina/Buenos_Aires
      # Permite que la red interna de Docker llegue a la WebUI
      - FIREWALL_OUTBOUND_SUBNETS=172.20.0.0/16
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Cliente de descargas - corre DENTRO de la red de gluetun
  # -----------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"   # <-- clave: todo su trafico va por la VPN
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - WEBUI_PORT=8080
    volumes:
      - /srv/config/qbittorrent:/config
      - /srv/media/downloads:/downloads
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Prowlarr - gestor central de indexers
  # -----------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks: [media]
    ports:
      - "100.x.y.z:9696:9696"   # solo Tailscale
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/prowlarr:/config
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Radarr - peliculas
  # -----------------------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks: [media]
    ports:
      - "100.x.y.z:7878:7878"   # solo Tailscale
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/radarr:/config
      - /srv/media:/data
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Sonarr - series
  # -----------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks: [media]
    ports:
      - "100.x.y.z:8989:8989"   # solo Tailscale
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/sonarr:/config
      - /srv/media:/data
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Bazarr - subtitulos (OpenSubtitles / Subdivx para espaniol)
  # -----------------------------------------------------------------------
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks: [media]
    ports:
      - "100.x.y.z:6767:6767"   # solo Tailscale
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/bazarr:/config
      - /srv/media:/data
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Jellyseerr - front de requests (para Jellyfin)
  # -----------------------------------------------------------------------
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    networks: [media]
    ports:
      - "100.x.y.z:5055:5055"   # solo Tailscale
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/jellyseerr:/app/config
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Tdarr - normalizacion de biblioteca (SOLO audio DTS->AC3 para tu Samsung)
  # -----------------------------------------------------------------------
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    networks: [media]
    ports:
      - "100.x.y.z:8265:8265"   # WebUI - solo Tailscale
      - "100.x.y.z:8266:8266"   # server port (nodos) - solo Tailscale
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - internalNode=true
      - inContainer=true
      - nodeName=vps-node
    volumes:
      - /srv/config/tdarr/server:/app/server
      - /srv/config/tdarr/configs:/app/configs
      - /srv/config/tdarr/logs:/app/logs
      - /srv/media:/data
      - /srv/config/tdarr/transcode_cache:/temp
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Recyclarr - sincroniza custom formats / quality profiles (TRaSH Guides)
  #   Corre, aplica y termina. Se dispara solo con su cron interno.
  #   No publica puertos: no necesita bind.
  # -----------------------------------------------------------------------
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    networks: [media]
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/recyclarr:/config
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # FlareSolverr - resuelve challenges de Cloudflare para Prowlarr
  #   Prowlarr le pega por la red interna 'media' (http://flaresolverr:8191).
  #   No necesita exponer puerto al host, pero lo bindeo a Tailscale por si
  #   queres debuggear desde tu maquina. Si no, borra el bloque ports.
  # -----------------------------------------------------------------------
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    networks: [media]
    ports:
      - "100.x.y.z:8191:8191"   # solo Tailscale (o borra: Prowlarr le pega por red interna)
    environment:
      - LOG_LEVEL=info
      - TZ=America/Argentina/Buenos_Aires
    restart: unless-stopped


networks:
  media:
    name: media
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16