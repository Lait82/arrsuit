# =========================================================================
#  Media stack para VPS (CPU-only) - Manu
#  Gluetun (ProtonVPN/WireGuard) -> qBittorrent   |   SABnzbd (usenet, directo)
#  Prowlarr, Radarr, Sonarr, Bazarr, Jellyseerr, Tdarr, Recyclarr, FlareSolverr
#  nginx -> unico servicio expuesto a internet (:80), proxea Jellyfin
#  fail2ban + geoipupdate -> capa de defensa del borde
#
#  Datos en /srv (config) y media en /srv/media
#
#  BINDS DE SEGURIDAD:
#    - nginx: 0.0.0.0:80 -> lo unico abierto a internet (geo + rate limit)
#    - Jellyfin: sin puerto publico; nginx le llega por la red 'media'.
#      El bind a ${TAILSCALE_IP} es solo para entrar al dashboard por tailnet.
#    - arr y paneles: ${TAILSCALE_IP} (IP Tailscale) -> solo vos, por el tailnet
#    - qBittorrent WebUI: ${TAILSCALE_IP}:8080, publicado por gluetun porque
#      qbit comparte su stack de red (network_mode: service:gluetun)
#    - SABnzbd: ${TAILSCALE_IP}:8081 (UI) + 127.0.0.1:8081 (API del script)
#    - Torrent (6881): sale por gluetun/ProtonVPN, no por la IP del VPS
#
#  La variable ${TAILSCALE_IP} la escribe el paso 1 de configure-stack.py.
#  Levanta el stack desde la carpeta que tiene el .env:
#      docker compose up -d
#  (o: docker compose --env-file /ruta/al/.env up -d)
#
#  El perfil 'geo' (geoipupdate) solo se activa si hay credenciales de MaxMind;
#  configure-stack.py lo decide y se lo pasa al compose.
# =========================================================================

services:

  # -----------------------------------------------------------------------
  # Jellyfin - media server. Lo unico que se ve desde internet, pero SIEMPRE
  # a traves de nginx: aca no publica el 8096 al mundo.
  #
  # El bind a ${TAILSCALE_IP} es comodidad para vos (dashboard sin pasar por
  # el geo-bloqueo); desde internet ese puerto no existe.
  # -----------------------------------------------------------------------
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    networks: [media]
    ports:
      - "${TAILSCALE_IP}:8096:8096"   # solo Tailscale (nginx entra por la red interna)
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/jellyfin:/config
      - /srv/media:/data
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # nginx - reverse proxy y UNICO servicio abierto a internet.
  #
  # Imagen de LinuxServer y no la oficial: trae compilado el modulo
  # ngx_http_geoip2, que la oficial no tiene y sin el no hay geo-bloqueo.
  #
  # Llega a Jellyfin por la red 'media' (http://jellyfin:8096), asi que
  # Jellyfin ya no necesita publicar el puerto en el host.
  #
  # /geoip es de solo lectura: lo llena geoipupdate, nginx solo lo lee.
  # -----------------------------------------------------------------------
  nginx:
    image: lscr.io/linuxserver/nginx:latest
    container_name: nginx
    networks: [media]
    ports:
      - "80:80"                 # internet
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/nginx:/config
      - geoip:/geoip:ro
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # geoipupdate - mantiene al dia la base GeoLite2 que usa el geo-bloqueo.
  #
  # Vive detras del perfil 'geo': sin credenciales de MaxMind la imagen sale
  # con error, asi que en vez de dejarla reiniciandose para siempre no se
  # levanta. configure-stack.py activa el perfil solo si el .env tiene las
  # credenciales, y en ese caso tambien renderiza el bloque geoip2 de nginx.
  #
  # GEOIPUPDATE_FREQUENCY esta en HORAS: 168 = una vez por semana.
  # -----------------------------------------------------------------------
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:latest
    container_name: geoipupdate
    profiles: ["geo"]
    networks: [media]
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID}
      - GEOIPUPDATE_LICENSE_KEY=${MAXMIND_LICENSE_KEY}
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-Country
      - GEOIPUPDATE_FREQUENCY=168
    volumes:
      - geoip:/usr/share/GeoIP
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # fail2ban - banea a nivel de firewall del host las IPs que fallan el login
  # de Jellyfin. Lee los logs por bind read-only, no por red.
  #
  # network_mode host + NET_ADMIN/NET_RAW: las reglas de baneo son del HOST,
  # no del contenedor. Sin la red del host, banearia su propio namespace y no
  # serviria de nada.
  #
  # OJO con la cadena de iptables (esta en jail.d/jellyfin.local): ahora que
  # nginx es un contenedor, el trafico entrante NO pasa por INPUT sino por el
  # camino de forward de Docker. Por eso el jail usa DOCKER-USER.
  # -----------------------------------------------------------------------
  fail2ban:
    image: lscr.io/linuxserver/fail2ban:latest
    container_name: fail2ban
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/fail2ban:/config
      # /remotelogs es la convencion de la imagen: una subcarpeta por app.
      - /srv/config/jellyfin/log:/remotelogs/jellyfin:ro
      - /srv/config/nginx/log/nginx:/remotelogs/nginx:ro
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # VPN: todo el trafico de qBittorrent sale por aca. Killswitch incluido.
  # -----------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    networks: [media]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${TAILSCALE_IP}:8080:8080"   # WebUI qBittorrent -> acceso por Tailscale via IP del host
      - "6881:6881"             # torrent TCP (sale por ProtonVPN igual)
      - "6881:6881/udp"         # torrent UDP
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      # >>> Pega tu private key de WireGuard de Proton aca (ver GUIA paso 1)
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # Port forwarding nativo de Proton (mejor ratio de seed)
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      # Elegi pais con servidores P2P (ej: Suiza, Paises Bajos)
      - SERVER_COUNTRIES=Spain
      - PORT_FORWARD_ONLY=on
      - TZ=America/Argentina/Buenos_Aires
      # Permite que la red interna de Docker llegue a la WebUI
      - FIREWALL_OUTBOUND_SUBNETS=172.20.0.0/16
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Cliente de descargas - corre DENTRO de la red de gluetun
  # -----------------------------------------------------------------------
  qbittorrent:
    # image: lscr.io/linuxserver/qbittorrent:latest # Wait until compatibility issues with radarr and sonarr are fixed before updating:
    image: lscr.io/linuxserver/qbittorrent:5.1.4
    container_name: qbittorrent
    network_mode: "service:gluetun"   # <-- clave: todo su trafico va por la VPN
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - WEBUI_PORT=8080
    volumes:
      - /srv/config/qbittorrent:/config
      - /srv/media/downloads:/downloads
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # SABnzbd - cliente de descargas USENET (el equivalente de qBittorrent
  # para NZB). Radarr y Sonarr manejan los dos protocolos a la vez.
  #
  # NO va detras de gluetun, a diferencia de qBittorrent: Usenet es SSL
  # directo contra tu proveedor, no es P2P. No hay swarm publico donde tu IP
  # quede expuesta, asi que la VPN no compra nada y solo agrega latencia.
  #
  # PUERTO: adentro escucha en 8080 igual que qBittorrent, asi que afuera se
  # publica en 8081 para no chocar con el bind de gluetun. Se publica en DOS
  # IPs del host (Docker lo permite: mismo puerto, distinta interfaz):
  #   - ${TAILSCALE_IP} -> para entrar vos con el navegador
  #   - 127.0.0.1       -> para que configure-stack.py le pegue a la API.
  #     Va por loopback y no por Tailscale porque SABnzbd responde 403
  #     ("External internet access denied") a todo lo que no venga de loopback
  #     o RFC1918, y la IP de Tailscale es CGNAT (100.64.0.0/10), que no entra.
  #
  # VOLUMEN: monta /srv/media como /data igual que Radarr/Sonarr. Es lo que
  # permite el hardlink de downloads/ -> movies/ (mismo filesystem). Si le
  # montaras solo la carpeta de descargas, perderias el hardlink.
  # -----------------------------------------------------------------------
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    networks: [media]
    ports:
      - "${TAILSCALE_IP}:8081:8080"   # UI por Tailscale (8081 afuera: 8080 lo usa qbit)
      - "127.0.0.1:8081:8080"         # API para el script (evita el 403 de SABnzbd)
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/sabnzbd:/config
      - /srv/media:/data
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Prowlarr - gestor central de indexers
  # -----------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks: [media]
    ports:
      - "${TAILSCALE_IP}:9696:9696"   # solo Tailscale
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/prowlarr:/config
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Radarr - peliculas
  # -----------------------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks: [media]
    ports:
      - "${TAILSCALE_IP}:7878:7878"   # solo Tailscale
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/radarr:/config
      - /srv/media:/data
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Sonarr - series
  # -----------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks: [media]
    ports:
      - "${TAILSCALE_IP}:8989:8989"   # solo Tailscale
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/sonarr:/config
      - /srv/media:/data
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Bazarr - subtitulos (OpenSubtitles / Subdivx para espaniol)
  # -----------------------------------------------------------------------
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks: [media]
    ports:
      - "${TAILSCALE_IP}:6767:6767"   # solo Tailscale
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/bazarr:/config
      - /srv/media:/data
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Jellyseerr - front de requests (para Jellyfin)
  # -----------------------------------------------------------------------
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    networks: [media]
    ports:
      - "${TAILSCALE_IP}:5055:5055"   # solo Tailscale
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/jellyseerr:/app/config
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Tdarr - normalizacion de biblioteca (SOLO audio DTS->AC3 para tu Samsung)
  # -----------------------------------------------------------------------
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    networks: [media]
    ports:
      - "${TAILSCALE_IP}:8265:8265"   # WebUI - solo Tailscale
      - "${TAILSCALE_IP}:8266:8266"   # server port (nodos) - solo Tailscale
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - internalNode=true
      - inContainer=true
      - nodeName=vps-node
    volumes:
      - /srv/config/tdarr/server:/app/server
      - /srv/config/tdarr/configs:/app/configs
      - /srv/config/tdarr/logs:/app/logs
      - /srv/media:/data
      - /srv/config/tdarr/transcode_cache:/temp
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Recyclarr - sincroniza custom formats / quality profiles (TRaSH Guides)
  #   Corre, aplica y termina. Se dispara solo con su cron interno.
  #   No publica puertos: no necesita bind.
  # -----------------------------------------------------------------------
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    networks: [media]
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /srv/config/recyclarr:/config
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # FlareSolverr - resuelve challenges de Cloudflare para Prowlarr
  #   Prowlarr le pega por la red interna 'media' (http://flaresolverr:8191).
  #   No necesita exponer puerto al host, pero lo bindeo a Tailscale por si
  #   queres debuggear desde tu maquina. Si no, borra el bloque ports.
  # -----------------------------------------------------------------------
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    networks: [media]
    ports:
      - "${TAILSCALE_IP}:8191:8191"   # solo Tailscale (o borra: Prowlarr le pega por red interna)
    environment:
      - LOG_LEVEL=info
      - TZ=America/Argentina/Buenos_Aires
    restart: unless-stopped


networks:
  media:
    name: media
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  # Base GeoLite2: la escribe geoipupdate, la lee nginx. Volumen y no bind
  # porque es un cache descartable, no config que quieras respaldar.
  geoip:
    name: geoip
