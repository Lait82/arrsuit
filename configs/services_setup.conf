{
    "common": {
        "language": "en"
    },
    "torrentClient": { "downloadDir": "/srv/media/downloads" },
    "radarr": { 
        "downloadClientCategory": "radarr",
        "rootFolder": "/data/movies"
    },
    "sonarr": {
        "downloadClientCategory": "sonarr",
        "rootFolder": "/data/series"
    },
    "sabnzbd": {
        "port": 8081,
        "completeDir": "/data/downloads/usenet",
        "incompleteDir": "/data/downloads/incomplete-usenet",
        "server": {
            "name": "principal",
            "host": "USENET_HOST",
            "sslPort": 563,
            "noSslPort": 119,
            "ssl": true,
            "connections": 99,
            "usernameEnv": "USENET_USER",
            "passwordEnv": "USENET_PASS"
        }
    },
    "prowlarr": {
        "indexers": [
            {
                "name": "nzb.life",
                "url": "https://nzb.life",
                "apiKeyEnv": "NZB_INDEXER_API_KEY"
            },
            {
                "name": "nzbGeek",
                "url": "https://api.nzbgeek.info",
                "apiKeyEnv": "NZB_GEEK_API_KEY"
            }
        ]
    },
    "jellyfin": {
        "setup": {
            "serverName": "userServer",
            "uiCulture": "es",
            "metadataCountryCode": "AR",
            "preferredMetadataLanguage": "es"
        },
        "transcoding": {
            "deleteSegments": true,
            "keepSegmentsSeconds": 3600
        },
        "libraries": [
            { "name": "Movies", "type": "movies",  "path": "/data/movies" },
            { "name": "Series", "type": "tvshows", "path": "/data/series" }
        ],
        "plugins": [
            {
                "name": "Moonbase",
                "repositoryName": "Moonfin",
                "repository": "https://raw.githubusercontent.com/Moonfin-Client/Plugin/refs/heads/master/manifest.json"
            }
        ]
    },
    "seerr": {
        "adminEmail": "",
        "radarr": { "minimumAvailability": "released" },
        "sonarr": { "seasonFolders": true }
    },
    "nginx": {
        "geoBlock": {
            "countries": ["AR"]
        }
    },
    "recyclarr": {
        "radarr": {
            "qualityProfile": {
                "name": "HD Bluray + WEB",
                "trashId": "d1d67249d3890e49bc12e275d989a7e9"
            },
            "customFormats": [
                { "name": "WiTH AD", "trashId": "127bdbadcf3e4463a8c707759fbaad75", "score": -10000 }
            ],
            "customFormatGroups": [
                { "name": "[Optional] Golden Rule HD", "trashId": "f8bf8eab4617f12dfdbd16303d8da245" },
                { "name": "[Unwanted] Unwanted Formats", "trashId": "a3ac6af01d78e4f21fcb75f601ac96df" }
            ]
        },
        "sonarr": {
            "qualityProfile": {
                "name": "WEB-1080p",
                "trashId": "72dae194fc92bf828f32cde7744e51a1"
            },
            "customFormats": [
                { "name": "Season Pack", "trashId": "3bc5f395426614e155e585a2f056cdf1", "score": -500 },
                { "name": "Single Episode", "trashId": "e0c1a67f23908a55b6ae9834e8ed6727", "score": 100 },
                { "name": "WiTH AD", "trashId": "44ccbcbc74506f208973e1463b11705f", "score": -10000 }
            ],
            "customFormatGroups": [
