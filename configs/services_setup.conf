{
    "common": {
        "language": "en"
    },
    "torrentClient": { "downloadDir": "/srv/media/downloads" },
    "radarr": { 
        "downloadClientCategory": "radarr",
        "rootFolder": "/data/movies"
    },
    "sonarr": {
        "downloadClientCategory": "sonarr",
        "rootFolder": "/data/series"
    },
    "sabnzbd": {
        "port": 8081,
        "completeDir": "/data/downloads/usenet",
        "incompleteDir": "/data/downloads/incomplete-usenet",
        "server": {
            "name": "principal",
            "host": "USENET_HOST",
            "sslPort": 563,
            "noSslPort": 119,
            "ssl": true,
            "connections": 99,
            "usernameEnv": "USENET_USER",
            "passwordEnv": "USENET_PASS"
        }
    },
    "prowlarr": {
        "indexers": [
            {
                "name": "nzb.life",
                "url": "https://nzb.life",
                "apiKeyEnv": "NZB_INDEXER_API_KEY"
            }
        ]
    }
}