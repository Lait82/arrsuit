# =========================================================================
#  Geo-bloqueo DESACTIVADO - se instala como 00-geoip.conf
#
#  Lo copia configure-stack.py cuando el .env no tiene credenciales de
#  MaxMind. $allowed_country tiene que existir igual: el server block la usa
#  en un 'if', y nginx no arranca con una variable que nadie define.
#
#  Se mapea sobre $host porque hace falta una variable de entrada cualquiera;
#  el valor es 'yes' siempre, o sea que no bloquea nada.
# =========================================================================

map $host $allowed_country {
    default yes;
}
