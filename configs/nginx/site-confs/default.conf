# =========================================================================
#  Reverse proxy para Jellyfin - Manu
#  - Escucha en :80 (HTTP, sin TLS: modelo de amenaza = bots de internet)
#  - Geo-bloqueo: solo pasa lo que habilite $allowed_country (00-geoip.conf)
#  - Rate limit SOLO en el endpoint de login
#  - proxy_pass a Jellyfin por la red interna 'media'
#
#  Se llama default.conf a proposito: la imagen recrea ese archivo con su
#  ejemplo si no existe, asi que ocupamos el nombre en vez de pelearlo.
#  nginx.conf lo incluye desde /config/nginx/site-confs/*.conf, o sea que
#  esto ya esta DENTRO del bloque http { }.
# =========================================================================

# Rate limit para el endpoint de autenticacion (10 req/min por IP)
limit_req_zone $binary_remote_addr zone=jelly_login:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;   # responde en la IP pelada

    # --- Geo-bloqueo ---
    # $allowed_country lo define 00-geoip.conf, que renderiza
    # configure-stack.py. Sin credenciales de MaxMind ese archivo deja la
    # variable en 'yes' fijo y esto no bloquea nada.
    if ($allowed_country = no) {
        return 403;
    }

    # El upstream va por variable y no literal a proposito: con un nombre
    # literal nginx resuelve 'jellyfin' UNA vez al arrancar y se queda con esa
    # IP. Si el contenedor se recrea y Docker le da otra, nginx sigue pegandole
    # a la vieja hasta que lo reinicies. Con variable re-resuelve por DNS
    # (resolver.conf apunta al DNS interno de Docker).
    set $jellyfin_upstream jellyfin;

    # Rate limit al login de Jellyfin (authenticatebyname / authenticate)
    location ~* /Users/(authenticatebyname|authenticate) {
        limit_req zone=jelly_login burst=5 nodelay;
        proxy_pass http://$jellyfin_upstream:8096;
        include /config/nginx/proxy_jellyfin.conf;
    }

    location / {
        proxy_pass http://$jellyfin_upstream:8096;
        include /config/nginx/proxy_jellyfin.conf;
    }
}
