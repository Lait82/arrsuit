# Headers de proxy para Jellyfin (incluye WebSockets)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Protocol $scheme;
proxy_set_header X-Forwarded-Host $http_host;

# WebSockets (Jellyfin los usa para sync de sesiones/reproduccion).
# $connection_upgrade sale de un map que ya trae el nginx.conf de la imagen:
# vale 'upgrade' solo cuando el cliente pide upgrade y 'close' en el resto, asi
# que las requests normales no pierden keep-alive.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_buffering off;
