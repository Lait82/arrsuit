# Filtro fail2ban para Jellyfin -> /config/fail2ban/filter.d/jellyfin.conf
# OJO: el formato del mensaje cambia entre versiones de Jellyfin.
# Validar SIEMPRE con (desde el host):
#   docker exec fail2ban fail2ban-regex \
#       /remotelogs/jellyfin/<archivo>.log /config/fail2ban/filter.d/jellyfin.conf
# Si no matchea, pegar una linea real del log (con IP tapada) y ajustar.

[Definition]
failregex = ^.*Authentication request for .* has been denied \(IP: "?<ADDR>"?\)\.
ignoreregex =
